<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <title>Valorant Agents</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background:
        radial-gradient(circle at top, rgba(255, 70, 85, 0.15), transparent 30%),
        linear-gradient(180deg, #0f172a 0%, #020617 100%);
    }

    .agent-card {
      transition: transform .2s ease, opacity .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .agent-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 34px rgba(2, 6, 23, 0.45);
    }

    .agent-card.moving {
      opacity: .45;
      transform: scale(.98);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100">
  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <section class="mb-8 overflow-hidden rounded-3xl border border-white/10 bg-slate-900/70 p-6 shadow-2xl backdrop-blur md:p-8">
      <div class="flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
        <div>
          <p class="mb-3 inline-flex rounded-full border border-rose-400/30 bg-rose-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-[0.2em] text-rose-300">
            Valorant
          </p>
          <h1 class="text-3xl font-black tracking-tight sm:text-4xl">Список агентов VALORANT</h1>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div class="rounded-2xl border border-white/10 bg-slate-800/70 px-4 py-3">
            <div class="text-xs uppercase tracking-widest text-slate-400">Всего</div>
            <div id="totalCount" class="mt-1 text-2xl font-bold">0</div>
          </div>
          <div class="rounded-2xl border border-white/10 bg-slate-800/70 px-4 py-3">
            <div class="text-xs uppercase tracking-widest text-slate-400">Слева</div>
            <div id="availableCount" class="mt-1 text-2xl font-bold">0</div>
          </div>
          <div class="rounded-2xl border border-white/10 bg-slate-800/70 px-4 py-3">
            <div class="text-xs uppercase tracking-widest text-slate-400">Справа</div>
            <div id="pickedCount" class="mt-1 text-2xl font-bold">0</div>
          </div>
        </div>
      </div>

      <div class="mt-5 flex flex-col gap-3 rounded-2xl border border-white/10 bg-slate-950/50 p-4 sm:flex-row sm:items-center sm:justify-between">
        <button
          id="resetButton"
          class="inline-flex items-center justify-center rounded-xl border border-rose-400/30 bg-rose-500/10 px-4 py-2 text-sm font-semibold text-rose-200 transition hover:bg-rose-500/20"
        >
          Сбросить выбор
        </button>
      </div>
    </section>

    <section class="grid gap-6 lg:grid-cols-2">
      <div class="rounded-3xl border border-white/10 bg-slate-900/70 p-5 shadow-xl backdrop-blur">
        <div class="mb-4 flex items-center justify-between gap-3">
          <div>
            <h2 class="text-2xl font-bold">Доступные агенты</h2>
            <p class="text-sm text-slate-400">Клик — отправить в правый список.</p>
          </div>
          <span class="rounded-full border border-cyan-400/20 bg-cyan-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-widest text-cyan-200">Список 1</span>
        </div>
        <div id="availableGrid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3"></div>
      </div>

      <div class="rounded-3xl border border-white/10 bg-slate-900/70 p-5 shadow-xl backdrop-blur">
        <div class="mb-4 flex items-center justify-between gap-3">
          <div>
            <h2 class="text-2xl font-bold">Выбранные агенты</h2>
            <p class="text-sm text-slate-400">Клик — вернуть обратно.</p>
          </div>
          <span class="rounded-full border border-amber-400/20 bg-amber-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-widest text-amber-200">Список 2</span>
        </div>
        <div id="pickedGrid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3"></div>
      </div>
    </section>
  </main>

      },
      {

        slug: 'waylay',

      },
      {
        name: 'Yoru',
        slug: 'yoru',
        image: 'https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/05e1a996814dd10d7179efee327d29a7be00e912-616x822.png?accountingTag=VAL&auto=format&fit=fill&q=80&w=352'
      }
    ];

    const state = {
      picked: new Set(JSON.parse(localStorage.getItem('valorant-picked') || '[]'))
    };

    const availableGrid = document.getElementById('availableGrid');
    const pickedGrid = document.getElementById('pickedGrid');
    const totalCount = document.getElementById('totalCount');
    const availableCount = document.getElementById('availableCount');
    const pickedCount = document.getElementById('pickedCount');
    const resetButton = document.getElementById('resetButton');

    function saveState() {
      localStorage.setItem('valorant-picked', JSON.stringify([...state.picked]));
    }

    function createAgentCard(agent, inPickedList) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'agent-card group w-full overflow-hidden rounded-2xl border border-white/10 bg-slate-800/70 text-left shadow-lg';

      card.innerHTML = `
        <div class="relative aspect-[3/4] overflow-hidden bg-slate-950">
          <img
            src="${agent.image}"
            alt="${agent.name}"
            loading="lazy"
            class="h-full w-full object-cover transition duration-300 group-hover:scale-[1.03]"
          />
          <div class="pointer-events-none absolute inset-x-0 bottom-0 h-28 bg-gradient-to-t from-slate-950 via-slate-950/50 to-transparent"></div>
          <div class="absolute left-3 top-3 rounded-full border border-white/10 bg-black/40 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-200 backdrop-blur">
            ${inPickedList ? 'Выбран' : 'Агент'}
          </div>
        </div>
        <div class="p-4">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 class="text-lg font-bold text-white">${agent.name}</h3>
              <p class="mt-1 text-sm text-slate-400">${inPickedList ? 'Нажми, чтобы вернуть обратно' : 'Нажми, чтобы отправить вправо'}</p>
            </div>
            <span class="mt-1 rounded-full border border-white/10 bg-slate-900/60 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-300">
              Valorant
            </span>
          </div>
          <div class="mt-4 flex items-center justify-between gap-3">
            <span class="text-xs text-slate-500">Официальное изображение</span>
            <a
              href="https://playvalorant.com/ru-ru/agents/${agent.slug}"
              target="_blank"
              rel="noreferrer"
              class="rounded-lg border border-white/10 bg-slate-900/60 px-3 py-1.5 text-xs font-semibold text-slate-200 transition hover:bg-slate-700"
              data-ignore-move="true"
            >Открыть</a>
          </div>
        </div>
      `;

      card.addEventListener('click', (event) => {
        if (event.target.closest('[data-ignore-move="true"]')) return;

        card.classList.add('moving');
        setTimeout(() => {
          if (state.picked.has(agent.name)) {
            state.picked.delete(agent.name);
          } else {
            state.picked.add(agent.name);
          }
          saveState();
          render();
        }, 120);
      });

      return card;
    }

    function render() {
      const available = agents.filter(agent => !state.picked.has(agent.name));
      const picked = agents.filter(agent => state.picked.has(agent.name));

      availableGrid.innerHTML = '';
      pickedGrid.innerHTML = '';

      available.forEach(agent => availableGrid.appendChild(createAgentCard(agent, false)));
      picked.forEach(agent => pickedGrid.appendChild(createAgentCard(agent, true)));

      if (available.length === 0) {
        availableGrid.innerHTML = `
          <div class="col-span-full rounded-2xl border border-dashed border-white/10 bg-slate-800/50 p-6 text-center text-slate-400">
            Здесь пока пусто. Все агенты уже перенесены вправо.
          </div>
        `;
      }

      if (picked.length === 0) {
        pickedGrid.innerHTML = `
          <div class="col-span-full rounded-2xl border border-dashed border-white/10 bg-slate-800/50 p-6 text-center text-slate-400">
            Тут пока никого нет. Нажми на карточку слева.
          </div>
        `;
      }

      totalCount.textContent = String(agents.length);
      availableCount.textContent = String(available.length);
      pickedCount.textContent = String(picked.length);
    }

    resetButton.addEventListener('click', () => {
      state.picked.clear();
      saveState();
      render();
    });

    render();
  </script>

</html>
